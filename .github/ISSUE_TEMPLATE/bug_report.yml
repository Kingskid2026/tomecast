name: Bug report
description: Something went wrong installing Tomecast or converting a book
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this!
        **Please don't attach copyrighted books.** Describe the problem, or share a public-domain example (for example from Project Gutenberg) that shows it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong? Include any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Book format
      options:
        - EPUB
        - PDF (normal text)
        - PDF (scanned)
        - DOCX
        - FB2
        - HTML
        - TXT
        - Not about a specific book
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System information
      description: |
        Paste the output of `tomecast doctor`. On versions without it, give your `tomecast --version`, your distro and version, and your graphics card (if any).
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, or a short audio clip of the problem.
