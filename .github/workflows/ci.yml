name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Lint install.sh
        run: uvx --from shellcheck-py shellcheck install.sh
      - name: Validate the desktop entry
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils
          uv run python -c "from tomecast.desktop import desktop_entry_text; print(desktop_entry_text('/usr/bin/tomecast'), end='')" > "$RUNNER_TEMP/tomecast.desktop"
          desktop-file-validate "$RUNNER_TEMP/tomecast.desktop"

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install the libraries Qt loads
        # Every desktop has these; CI's server image doesn't. The window's tests run headless.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked
      - run: uv run pytest

  windows:
    # Groundwork for the Windows version (#39): shows what already works on Windows. While the
    # port is unfinished the checks are expected to fail, so they never fail the job: each one
    # runs whatever happened before it, and the last step lists the results in the run's
    # summary and as warnings, so the PR shows a passing job, not a red mark everyone learns
    # to ignore. tests/conftest.py lists the tests that can't load on Windows yet, and why.
    name: Windows (experimental)
    runs-on: windows-latest
    continue-on-error: true  # only setting up (checkout, uv sync) can fail the job
    timeout-minutes: 30  # a test that hangs on Windows mustn't hold a runner for 6 hours
    steps:
      # Keep LF line endings, as on Linux: some tests compare files byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - id: ruff
        name: ruff check
        continue-on-error: true
        run: uv run ruff check
      - id: format
        name: ruff format --check
        continue-on-error: true
        run: uv run ruff format --check
      - id: mypy
        name: mypy (checks the Windows branches of tomecast.oslayer)
        continue-on-error: true
        run: uv run mypy
      - id: pytest
        name: pytest
        continue-on-error: true
        run: uv run pytest
      - id: pssa
        name: Lint install.ps1
        continue-on-error: true
        shell: pwsh
        run: |
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning, Error
          $found | Format-Table -AutoSize | Out-String -Width 200
          if ($found) { exit 1 }
      - id: install
        name: Run install.ps1 against this checkout
        continue-on-error: true
        shell: pwsh
        env:
          TOMECAST_PACKAGE: ${{ github.workspace }}
        run: |
          ./install.ps1
          & "$(uv tool dir --bin)\tomecast.exe" --version
      - name: Results (they don't fail CI while the port is in progress)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          RUFF: ${{ steps.ruff.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
          PYTEST: ${{ steps.pytest.outcome }}
          PSSA: ${{ steps.pssa.outcome }}
          INSTALL: ${{ steps.install.outcome }}
        run: |
          $checks = [ordered]@{
            'ruff check' = $env:RUFF
            'ruff format --check' = $env:FORMAT
            'mypy' = $env:MYPY
            'pytest' = $env:PYTEST
            'PSScriptAnalyzer on install.ps1' = $env:PSSA
            'install.ps1 against this checkout' = $env:INSTALL
          }
          $table = @('### Windows (experimental, #39)', '', '| Check | Result |', '|---|---|')
          foreach ($check in $checks.GetEnumerator()) {
            $table += "| $($check.Key) | $($check.Value) |"
            if ($check.Value -ne 'success') {
              Write-Output "::warning title=Windows (experimental)::$($check.Key): $($check.Value) (see that step's log; expected while #39 is in progress)"
            }
          }
          $table -join "`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  install:
    # Proves the one-line installer works on a clean copy of each distro.
    name: Install on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          - image: ubuntu:24.04
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          - image: debian:12
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          - image: debian:13
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          - image: fedora:latest
            prep: "true"
          - image: archlinux:latest
            prep: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run install.sh in a clean container
        env:
          IMAGE: ${{ matrix.image }}
          PREP: ${{ matrix.prep }}
        run: |
          docker run --rm -e PREP -v "$PWD:/src:ro" "$IMAGE" sh -euc '
            eval "$PREP"
            cp -r /src /tmp/tomecast
            TOMECAST_PACKAGE=/tmp/tomecast sh /tmp/tomecast/install.sh
            "$HOME/.local/bin/tomecast" --version
          '
