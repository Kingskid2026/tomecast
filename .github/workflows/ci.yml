name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Lint install.sh
        run: uvx --from shellcheck-py shellcheck install.sh
      - name: Validate the desktop entry
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils
          uv run python -c "from tomecast.desktop import desktop_entry_text; print(desktop_entry_text('/usr/bin/tomecast'), end='')" > "$RUNNER_TEMP/tomecast.desktop"
          desktop-file-validate "$RUNNER_TEMP/tomecast.desktop"

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install the libraries Qt loads
        # Every desktop has these; CI's server image doesn't. The window's tests run headless.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked
      - run: uv run pytest

  windows:
    # Groundwork for the Windows version (#39): shows what already works on Windows without
    # failing CI while the port is unfinished. Every check runs even if an earlier one fails.
    # tests/conftest.py lists the tests that can't load on Windows yet, and why.
    name: Windows (port in progress)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30  # a test that hangs on Windows mustn't hold a runner for 6 hours
    steps:
      # Keep LF line endings, as on Linux: some tests compare files byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - id: sync
        run: uv sync --locked
      - name: ruff check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check
      - name: ruff format --check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff format --check
      - name: mypy (checks the Windows branches of tomecast.oslayer)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run mypy
      - name: pytest
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest
      - name: Lint install.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning, Error
          $found | Format-Table -AutoSize | Out-String -Width 200
          if ($found) { exit 1 }
      - name: Run install.ps1 against this checkout
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          TOMECAST_PACKAGE: ${{ github.workspace }}
        run: |
          ./install.ps1
          & "$(uv tool dir --bin)\tomecast.exe" --version

  install:
    # Proves the one-line installer works on a clean copy of each distro.
    name: Install on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          - image: ubuntu:24.04
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          - image: debian:12
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          - image: debian:13
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          - image: fedora:latest
            prep: "true"
          - image: archlinux:latest
            prep: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run install.sh in a clean container
        env:
          IMAGE: ${{ matrix.image }}
          PREP: ${{ matrix.prep }}
        run: |
          docker run --rm -e PREP -v "$PWD:/src:ro" "$IMAGE" sh -euc '
            eval "$PREP"
            cp -r /src /tmp/tomecast
            TOMECAST_PACKAGE=/tmp/tomecast sh /tmp/tomecast/install.sh
            "$HOME/.local/bin/tomecast" --version
          '
