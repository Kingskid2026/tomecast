[project]
name = "tomecast"
version = "0.1.2"
description = "Turn ebooks into audiobooks on Linux with local, human-sounding voices."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ambrose Sigler" }]
# 3.12+: PySide6 6.12 drops a reference to None in some void methods (QImage.fill,
# setDevicePixelRatio...). That's harmless where None is immortal (3.12+, PEP 683) but
# crashes 3.11. uv fetches a newer Python automatically where the system's is older.
requires-python = ">=3.12"
keywords = ["audiobook", "text-to-speech", "tts", "epub", "docx", "fb2", "ebook", "linux", "kokoro", "local-ai"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "imageio-ffmpeg>=0.8.1",
    "lxml>=6.1.3",
    "pypdfium2>=5.14.0",
    "pyside6-essentials>=6.12.0",
    "python-docx>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/Kingskid2026/tomecast"
Documentation = "https://github.com/Kingskid2026/tomecast/blob/main/docs/architecture.md"
Issues = "https://github.com/Kingskid2026/tomecast/issues"
Changelog = "https://github.com/Kingskid2026/tomecast/blob/main/CHANGELOG.md"

[project.scripts]
tomecast = "tomecast.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.3",
    "types-lxml>=2026.2.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "SIM", # simplifications
    "RUF", # ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
# Tests use real Chinese/Japanese text, whose fullwidth punctuation looks like ASCII.
"tests/**" = ["RUF001"]
# Long word lists read better as one string than as a list of strings.
"src/tomecast/textprep_en.py" = ["SIM905"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "posix_only: needs POSIX behaviour (shebang scripts, permission bits, symlinks, Linux-only features); skipped on Windows (#39)",
]

[[tool.mypy.overrides]]
# pypdfium2 ships no type information; its values are checked where they enter our code.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
