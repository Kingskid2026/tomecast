  <title>Tomecast</title>
  <rect width="256" height="256" rx="56" fill="#0B0B0C"/>
  <circle cx="48" cy="48" r="14" fill="#F2F2F2"/>
  <circle cx="88" cy="48" r="14" fill="#F2F2F2"/>
  <circle cx="128" cy="48" r="14" fill="#F2F2F2"/>
  <circle cx="168" cy="48" r="14" fill="#F2F2F2"/>
  <circle cx="208" cy="48" r="14" fill="#F2F2F2"/>
  <circle cx="48" cy="88" r="14" fill="#F2F2F2"/>
  <circle cx="88" cy="88" r="14" fill="#F2F2F2"/>
  <circle cx="128" cy="88" r="14" fill="#F2F2F2"/>
