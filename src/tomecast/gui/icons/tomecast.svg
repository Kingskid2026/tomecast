<?xml version="1.0" encoding="UTF-8"?>
<!-- Tomecast's app icon: "A · Sentence grid" from the maintainer's icon options (see
     docs/design.md, "App icon"). A 5 × 5 grid of dots in reading order: the voiced
     sentences are light, the one being spoken is the accent, the rest are still waiting.
     The <title> is how desktop.py recognises the installed copy as Tomecast's. -->
