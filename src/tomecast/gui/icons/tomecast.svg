  <circle cx="208" cy="88" r="14" fill="#F2F2F2"/>
  <circle cx="48" cy="128" r="14" fill="#F2F2F2"/>
  <circle cx="88" cy="128" r="14" fill="#F2F2F2"/>
  <circle cx="128" cy="128" r="14" fill="#7C8CFF"/>
